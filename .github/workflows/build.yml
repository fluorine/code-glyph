name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Test
        run: dotnet test tests/CodeGlyph.Core.Tests --configuration Release

      - name: Build VSIX
        run: msbuild src/CodeGlyph.Vsix/CodeGlyph.Vsix.csproj /restore /p:Configuration=Release /v:m

      - uses: actions/upload-artifact@v4
        with:
          name: CodeGlyph.vsix
          path: src/CodeGlyph.Vsix/bin/Release/net48/CodeGlyph.Vsix.vsix

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx vsce package --no-dependencies

      - uses: actions/upload-artifact@v4
        with:
          name: codeglyph-vscode.vsix
          path: vscode/*.vsix
